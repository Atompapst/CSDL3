name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version, CalVer format, e.g. 2026.8.20. Leave empty to use today's UTC date."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: self-hosted-sdl
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  DOTNET_ROOT: /home/github-runner/.dotnet
  SDL_SOURCE_ROOT: /home/github-runner/source
  SDL_BUILD_ROOT: /home/github-runner/.cache/csdl3/sdl-build
  SDL_PREFIX: /home/github-runner/.local/csdl3/sdl-install
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  publish:
    name: Build, test, pack and publish
    timeout-minutes: 90
    runs-on: [self-hosted, linux, x64]

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use runner .NET SDK
        run: |
          set -euo pipefail

          echo "DOTNET_ROOT=$DOTNET_ROOT" >> "$GITHUB_ENV"
          echo "$DOTNET_ROOT" >> "$GITHUB_PATH"
          echo "$DOTNET_ROOT/tools" >> "$GITHUB_PATH"

          "$DOTNET_ROOT/dotnet" --info

      - name: Prepare SDL environment
        run: |
          set -euo pipefail

          mkdir -p "$SDL_BUILD_ROOT" "$SDL_PREFIX"

          echo "$SDL_PREFIX/lib" >> "$GITHUB_PATH"
          echo "LD_LIBRARY_PATH=$SDL_PREFIX/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"

          echo
          echo "┌──────────────────────────────────────────────┐"
          echo "│ Environment                                  │"
          echo "├──────────────────────────────────────────────┤"
          printf "│ %-44s │\n" "DOTNET_ROOT=$DOTNET_ROOT"
          printf "│ %-44s │\n" "SDL_PREFIX=$SDL_PREFIX"
          echo "└──────────────────────────────────────────────┘"
          echo

          {
            echo "## Publish Environment"
            echo
            echo "| Variable | Value |"
            echo "|---|---|"
            echo "| \`DOTNET_ROOT\` | \`$DOTNET_ROOT\` |"
            echo "| \`SDL_SOURCE_ROOT\` | \`$SDL_SOURCE_ROOT\` |"
            echo "| \`SDL_BUILD_ROOT\` | \`$SDL_BUILD_ROOT\` |"
            echo "| \`SDL_PREFIX\` | \`$SDL_PREFIX\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Update SDL sources
        run: |
          set -euo pipefail

          sources=(SDL SDL_image SDL_mixer SDL_net SDL_ttf)

          {
            echo "## SDL Sources"
            echo
            echo "| Component | Revision |"
            echo "|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for source in "${sources[@]}"; do
            repository="$SDL_SOURCE_ROOT/$source"

            echo "::group::Update $source"

            test -d "$repository/.git"

            git -C "$repository" pull --ff-only
            revision="$(git -C "$repository" rev-parse --short HEAD)"

            echo "$source @ $revision"
            echo "::endgroup::"

            echo "| \`$source\` | \`$revision\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo >> "$GITHUB_STEP_SUMMARY"

      - name: Build and install SDL runtimes
        run: |
          set -euo pipefail

          sources=(SDL SDL_image SDL_mixer SDL_net SDL_ttf)

          {
            echo "## SDL Build"
            echo
            echo "| Component | Build directory | Install prefix |"
            echo "|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"

          for source in "${sources[@]}"; do
            repository="$SDL_SOURCE_ROOT/$source"
            build_directory="$SDL_BUILD_ROOT/$source"

            echo "::group::Configure $source"
            cmake -S "$repository" -B "$build_directory" \
              -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX="$SDL_PREFIX" \
              -DCMAKE_PREFIX_PATH="$SDL_PREFIX" \
              -DSDL_SHARED=ON \
              -DSDL_STATIC=OFF \
              -DSDL_TESTS=OFF \
              -DSDL_TEST_LIBRARY=OFF \
              -DSDL_EXAMPLES=OFF
            echo "::endgroup::"

            echo "::group::Build $source"
            cmake --build "$build_directory" --parallel
            echo "::endgroup::"

            echo "::group::Install $source"
            cmake --install "$build_directory"
            echo "::endgroup::"

            echo "| \`$source\` | \`$build_directory\` | \`$SDL_PREFIX\` |" >> "$GITHUB_STEP_SUMMARY"
          done

          echo >> "$GITHUB_STEP_SUMMARY"

      - name: Summarize SDL runtimes
        run: |
          set -euo pipefail

          test -d "$SDL_PREFIX/lib"

          mapfile -t runtimes < <(
            find "$SDL_PREFIX/lib" -maxdepth 1 -type f -name 'libSDL3*.so*' -print | sort
          )

          if [ "${#runtimes[@]}" -eq 0 ]; then
            echo "No SDL runtime files found in $SDL_PREFIX/lib"
            exit 1
          fi

          echo
          echo "SDL runtimes:"
          for file in "${runtimes[@]}"; do
            printf "  - %s\n" "$(basename "$file")"
          done
          echo

          {
            echo "## Installed SDL Runtimes"
            echo
            echo "| Runtime | Size |"
            echo "|---|---:|"

            for file in "${runtimes[@]}"; do
              name="$(basename "$file")"
              size="$(numfmt --to=iec --suffix=B "$(stat -c%s "$file")")"
              echo "| \`$name\` | $size |"
            done

            echo
          } >> "$GITHUB_STEP_SUMMARY"
      
      - name: Determine package version
        id: version
        run: |
          set -euo pipefail

          INPUT_VERSION="${{ inputs.version }}"

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(date -u +'%-Y.%-m.%-d')"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid NuGet version: $VERSION"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo
          echo "┌──────────────────────────────────────────────┐"
          echo "│ NuGet package version                        │"
          echo "├──────────────────────────────────────────────┤"
          printf "│ %-44s │\n" "$VERSION"
          echo "└──────────────────────────────────────────────┘"
          echo

          {
            echo "## NuGet Publish"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Package | \`CSDL3\` |"
            echo "| Version | \`$VERSION\` |"
            echo "| Source | \`https://api.nuget.org/v3/index.json\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Restore
        run: |
          set -euo pipefail

          if find . -name packages.lock.json -print -quit | grep -q .; then
            dotnet restore --locked-mode --verbosity minimal
          else
            dotnet restore --verbosity minimal
          fi

      - name: Build
        run: dotnet build --configuration Release --no-restore --verbosity minimal -p:Version=${{ steps.version.outputs.version }}

      - name: Stage locally built SDL runtimes
        run: |
          set -euo pipefail

          test_dll="$(find CSDL.Tests/bin/Release -name CSDL.Tests.dll -print -quit)"
          test -n "$test_dll"

          test_output="$(dirname "$test_dll")"

          find "$SDL_PREFIX/lib" -maxdepth 1 -name 'libSDL3*.so*' -exec cp -a {} "$test_output/" \;

          echo
          echo "┌──────────────────────────────────────────────┐"
          echo "│ SDL runtimes staged for tests                │"
          echo "├──────────────────────────────────────────────┤"
          printf "│ %-44s │\n" "$test_output"
          echo "└──────────────────────────────────────────────┘"
          echo

          {
            echo "## Test Runtime Staging"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Test output | \`$test_output\` |"
            echo "| Runtime source | \`$SDL_PREFIX/lib\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Test
        run: dotnet test CSDL.Tests/CSDL.Tests.csproj --configuration Release --no-build --verbosity minimal --logger trx

      - name: Pack
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          dotnet pack CSDL/CSDL.csproj \
            --configuration Release \
            --no-build \
            --verbosity minimal \
            -p:Version=${{ steps.version.outputs.version }} \
            -o artifacts

          echo
          echo "┌──────────────────────────────────────────────┐"
          echo "│ Created NuGet packages                       │"
          echo "├──────────────────────────────────────────────┤"

          while IFS= read -r package; do
            name="$(basename "$package")"
            printf "│ %-44s │\n" "$name"
          done < <(find artifacts -maxdepth 1 -name '*.nupkg' -print | sort)

          echo "└──────────────────────────────────────────────┘"
          echo

          {
            echo "## Created Packages"
            echo
            echo "| Package | Size |"
            echo "|---|---:|"

            while IFS= read -r package; do
              name="$(basename "$package")"
              size="$(numfmt --to=iec --suffix=B "$(stat -c%s "$package")")"
              echo "| \`$name\` | $size |"
            done < <(find artifacts -maxdepth 1 -name '*.nupkg' -print | sort)

            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-${{ steps.version.outputs.version }}
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: NuGet login using OIDC
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          set -euo pipefail

          dotnet nuget push "artifacts/*.nupkg" \
            --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate

          echo
          echo "┌──────────────────────────────────────────────┐"
          echo "│ Published to NuGet.org                       │"
          echo "├──────────────────────────────────────────────┤"
          printf "│ %-44s │\n" "CSDL3 ${{ steps.version.outputs.version }}"
          echo "└──────────────────────────────────────────────┘"
          echo

      - name: Tag release
        run: |
          set -euo pipefail

          VERSION="${{ steps.version.outputs.version }}"
          TAG="v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git fetch --tags --force

          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "Tag $TAG already exists."
            echo "tag_status=already-exists" >> "$GITHUB_ENV"
          else
            git tag "$TAG"
            git push origin "$TAG"
            echo "tag_status=created" >> "$GITHUB_ENV"
          fi

          echo
          echo "┌──────────────────────────────────────────────┐"
          echo "│ Release tag                                  │"
          echo "├──────────────────────────────────────────────┤"
          printf "│ %-44s │\n" "$TAG"
          echo "└──────────────────────────────────────────────┘"
          echo

          {
            echo "## Release Tag"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Status | \`${tag_status:-created}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: test-results-${{ steps.version.outputs.version }}
          path: "**/TestResults/*.trx"
          if-no-files-found: ignore

      - name: Write final publish summary
        if: always()
        run: |
          set -euo pipefail

          {
            echo "## Final Publish Result"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Job status | \`${{ job.status }}\` |"
            echo "| Package | \`CSDL3\` |"
            echo "| Version | \`${{ steps.version.outputs.version }}\` |"
            echo "| Configuration | \`Release\` |"
            echo "| Target framework | \`net10.0\` |"
            echo "| Runner | \`${{ runner.name }}\` |"
            echo "| Ref | \`${{ github.ref }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"