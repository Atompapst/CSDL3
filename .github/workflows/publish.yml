name: Publish to NuGet

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Override version, CalVer format, e.g. 2026.8.20. Leave empty to use today's UTC date."
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: self-hosted-sdl
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  prepare-release:
    name: Determine release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      should_publish: ${{ steps.release.outputs.should_publish }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Determine version and check release tag
        id: release
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$(date -u +'%-Y.%-m.%-d')"
          fi

          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Invalid NuGet version: $VERSION"
            exit 1
          fi

          TAG="v$VERSION"
          if git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            SHOULD_PUBLISH=false
            echo "Release tag $TAG already exists; skipping publish."
          else
            SHOULD_PUBLISH=true
            echo "Release tag $TAG does not exist; publishing is required."
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "should_publish=$SHOULD_PUBLISH" >> "$GITHUB_OUTPUT"

  publish:
    name: Build, pack and publish
    needs: prepare-release
    if: needs.prepare-release.outputs.should_publish == 'true'
    timeout-minutes: 30
    runs-on: [self-hosted, linux, x64]
    env:
      DOTNET_ROOT: /home/github-runner/.dotnet
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Use runner .NET SDK
        run: |
          set -euo pipefail

          echo "DOTNET_ROOT=$DOTNET_ROOT" >> "$GITHUB_ENV"
          echo "$DOTNET_ROOT" >> "$GITHUB_PATH"
          echo "$DOTNET_ROOT/tools" >> "$GITHUB_PATH"

          "$DOTNET_ROOT/dotnet" --info

      - name: Restore
        run: |
          set -euo pipefail

          if find . -name packages.lock.json -print -quit | grep -q .; then
            dotnet restore CSDL/CSDL.csproj --locked-mode --verbosity minimal
            dotnet restore tools/ExpandInheritDoc/ExpandInheritDoc.csproj --locked-mode --verbosity minimal
          else
            dotnet restore CSDL/CSDL.csproj --verbosity minimal
            dotnet restore tools/ExpandInheritDoc/ExpandInheritDoc.csproj --verbosity minimal
          fi

      - name: Build
        run: dotnet build CSDL/CSDL.csproj --configuration Release --no-restore --verbosity minimal -p:Version=${{ needs.prepare-release.outputs.version }}

      - name: Pack
        run: |
          set -euo pipefail

          rm -rf artifacts
          mkdir -p artifacts

          dotnet pack CSDL/CSDL.csproj \
            --configuration Release \
            --no-build \
            --no-restore \
            --verbosity minimal \
            -p:Version=${{ needs.prepare-release.outputs.version }} \
            -o artifacts

          echo
          echo "┌──────────────────────────────────────────────┐"
          echo "│ Created NuGet packages                       │"
          echo "├──────────────────────────────────────────────┤"

          while IFS= read -r package; do
            name="$(basename "$package")"
            printf "│ %-44s │\n" "$name"
          done < <(find artifacts -maxdepth 1 -name '*.nupkg' -print | sort)

          echo "└──────────────────────────────────────────────┘"
          echo

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nuget-package-${{ needs.prepare-release.outputs.version }}
          path: artifacts/*.nupkg
          if-no-files-found: error

      - name: NuGet login using OIDC
        uses: NuGet/login@v1
        id: nuget_login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          set -euo pipefail

          VERSION="${{ needs.prepare-release.outputs.version }}"
          PACKAGE_URL="https://api.nuget.org/v3-flatcontainer/csdl3/$VERSION/csdl3.$VERSION.nupkg"

          echo
          echo "┌──────────────────────────────────────────────┐"
          if curl --fail --silent --show-error --head "$PACKAGE_URL"; then
            echo "│ Already available on NuGet.org                │"
            echo "├──────────────────────────────────────────────┤"
            printf "│ %-44s │\n" "CSDL3 $VERSION"
            echo "└──────────────────────────────────────────────┘"
          else
            dotnet nuget push "artifacts/*.nupkg" \
              --api-key "${{ steps.nuget_login.outputs.NUGET_API_KEY }}" \
              --source https://api.nuget.org/v3/index.json

            echo "│ Published to NuGet.org                       │"
            echo "├──────────────────────────────────────────────┤"
            printf "│ %-44s │\n" "CSDL3 $VERSION"
            echo "└──────────────────────────────────────────────┘"
          fi
          echo

      - name: Tag release
        run: |
          set -euo pipefail

          VERSION="${{ needs.prepare-release.outputs.version }}"
          TAG="v$VERSION"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "$TAG"
          git push origin "$TAG"

      - name: Write final publish summary
        if: always()
        run: |
          set -euo pipefail

          {
            echo "## Final Publish Result"
            echo
            echo "| Field | Value |"
            echo "|---|---|"
            echo "| Job status | \`${{ job.status }}\` |"
            echo "| Package | \`CSDL3\` |"
            echo "| Version | \`${{ needs.prepare-release.outputs.version }}\` |"
            echo "| Configuration | \`Release\` |"
            echo "| Target framework | \`net10.0\` |"
            echo "| Runner | \`${{ runner.name }}\` |"
            echo "| Ref | \`${{ github.ref }}\` |"
            echo
          } >> "$GITHUB_STEP_SUMMARY"
